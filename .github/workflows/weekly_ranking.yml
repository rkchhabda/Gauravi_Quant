name: Weekly Ranking Report

on:
  schedule:
    - cron: '30 3 * * 1'   # Mondays 03:30 UTC = 09:00 IST
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-ranking
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly ranking report
        run: python weekly_ranking_report.py

      - name: Build Pages site
        run: python build_rankings_index.py --publish-dir public

      - name: Commit snapshots (paper-trading track record)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/rankings public
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly ranking snapshot $(date +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
